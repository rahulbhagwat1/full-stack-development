<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>University Registration Form</h1>
        <p>Plese fill out the form to register</p>
        <hr>
    </header>

    <form>
        <h2>Personal Details</h2>
        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="fname" placeholder="eg:rahul" required>

        <br><br>

        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname" placeholder="eg:Bhagwat">

        <br><br>

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="DAteofbirths">

        <br><br>

        <label for="gender">Gender:</label>
        <br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <br>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <br>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">other</label>

        <br><br>

        <label for="photo">Upload your photo:</label>
        <br>
        <input type="file" id="photo" name="userPhoto">
        
        <br><br>

        <label for="color">Your favroit color</label>
        <input type="color">

        <br><br><hr>

        <h2>Contact Information</h2>

        <label for="Email">Email Address</label>
        <input type="email" id="Email" name="Email" placeholder="eg:xyz@gnail.com">

        <br><br>

        <label for="phno">Phone Number</label>
        <input type="tel" id="phno" name="phno" placeholder="eg:1234567890">

        <br><br>

        <label for="mAdd">mailing address:</label>
        <br>
        <textarea type="text" id="mAdd" name="mAdd" placeholder="Adress here" rows="4"></textarea>
        
        <br><br><hr>

        <h2>Academic information</h2>

        <label for="Course">Select your Course</label><br>
        
        <select name="Course" id="Course" aria-placeholder="select a Course">
            <option value="cs">cs</option>
            <option value="it">it</option>
            <option value="aids">aids</option>
            <option value="entc">entc</option>
        </select>

        <br><br>
        <label for="">extra subject </label>

        <br>

        <label for="maths">Maths</label>
        <input type="checkbox" id="maths" name="subject" value="Maths">

        <br>
        <label for="sci">Science</label>
        <input type="checkbox" id="sci" name="subject" value="Science">

        <br>
        <label for="marathi">marathi</label>
        <input type="checkbox" id="marathi" name="subject" value="marathi">

        <br>
        <label for="sans">sanskrit</label>
        <input type="checkbox" id="sans" name="subject" value="sanskrit">
        <br><br>

        <hr>
        <h2>Create Your Accout</h2>
    
    

        <button type="submit">register</button>
        <button type="reset">clear form</button>
    
    
    
    </form>

</body>
</html>
