<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="display: flex; align-items: center ; justify-content: center; background-color: black;">
    
    
    <h1 id="timer" style="color: gold; "></h1>

    <script>
        const h1 = document.getElementById("timer")

        setInterval(() => {
            let time = new Date();
            h1.textContent = time.toLocaleString();
        }, 1000);
    </script>
</body>
</html>
