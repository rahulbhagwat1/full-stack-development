<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="display: flex; align-items: center ; justify-content: center; background-color: black; flex-direction: column;">
    
    <h1 style="color: gold; ">Cricket World Cup In</h1>
    <h1 id="timer" style="color: gold; "></h1>

    <script>
        const h1 = document.getElementById("timer")
        
        const cricketTime = new Date(2027,8,4).getTime();
        console.log(cricketTime);
        setInterval(() => {
            const currentTime = new Date().getTime();
            const remainingTime = cricketTime-currentTime;
            const days = Math.floor(remainingTime/(1000*60*60*24));
            const hoursInMS = remainingTime%(1000*60*60*24);
            const hours = Math.floor(hoursInMS/(1000*60*60));
            const minutesInMs=hoursInMS%(1000*60*60);
            const minutes = Math.floor(minutesInMs/(1000*60));
            const secondsInMs = minutesInMs%(1000*60);
            const seconds = Math.floor(secondsInMs/(1000));

            

            h1.textContent=(`Days: ${days}    Hours: ${hours}  Minutes: ${minutes}  Seconds: ${seconds}`);
        }, 1000);
        
    </script>
</body>
</html>
