<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        .timer-box {
            width: 380px;
            padding: 40px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .title {
            color: #ffffff;
            font-size: 18px;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        h1 {
            color: #ffffff;
            font-size: 38px;
            margin-bottom: 35px;
            letter-spacing: 1px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        #startt {
            background: #22c55e;
            color: white;
        }

        #stopp {
            background: #ef4444;
            color: white;
        }

        #resett {
            background: #3b82f6;
            color: white;
        }

        button:active {
            transform: scale(0.96);
        }
    </style>
</head>

<body>

    <div class="timer-box">

        <div class="title">STOPWATCH</div>

        <h1>Minutes:00 Seconds:00</h1>

        <div class="buttons">
            <button id="startt">Start</button>
            <button id="stopp">Stop</button>
            <button id="resett">Reset</button>
        </div>

    </div>


    <script>
        const div = document.querySelector(".buttons");
        const h1 = document.querySelector("h1");


        let count = 0;
        let interval;

        div.addEventListener("click",(event)=>{

            if(event.target.id=="resett"){
                h1.textContent="Minutes:00 Seconds:00";
                count=0;
                clearInterval(interval);
                interval=null;
                
            }

            else if(event.target.id=="startt"){

                if(interval){
                    return;
                }

                interval = setInterval(()=>{
                    count++;

                    let minutes = Math.floor(count/60);
                    let seconds = count%60;

                    h1.textContent =
                    `Minutes:${String(minutes).padStart(2, "0")} Seconds:${String(seconds).padStart(2, "0")}`;

                },1000);
            }

            else if(event.target.id=="stopp"){
                clearInterval(interval);
                interval=null;
            }

        })
    </script>

</body>
</html>
