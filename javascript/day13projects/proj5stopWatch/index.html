<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="display: flex; justify-content: center;">Minutes:00 Seconds:00</h1>
    <div style="display: flex; justify-content: center; align-items: center; flex-direction: row;">
        <button id="startt">start</button>
        <button id="stopp">Stop</button>
        <button id="resett">Reset</button>
    </div>

    <script>
        const div = document.querySelector("div");
        const h1 = document.querySelector("h1");

        let count = 0;
        let interval;
        div.addEventListener("click",(event)=>{
            if(event.target.id=="resett"){
                h1.textContent="Minutes:00 Seconds:00";
                count=0;
                clearInterval(interval);
                interval=null;
                
            }
            else if(event.target.id=="startt"){
                if(interval){
                    return;
                }
                interval = setInterval(()=>{
                    count++;
                    let minutes = Math.floor(count/60);
                    let seconds = count%60;
                    h1.textContent = `Minutes:${String(minutes).padStart(2, "0")} Seconds:${String(seconds).padStart(2, "0")}`;
                },1000);
            }
            else if(event.target.id=="stopp"){
                clearInterval(interval);
                interval=null;
            }

        })
    </script>

</body>
</html>
